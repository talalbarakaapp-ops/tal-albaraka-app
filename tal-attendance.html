*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 "Segoe UI",Tahoma,Arial,sans-serif}
.app{max-width:1180px;margin:auto;padding:14px 14px 96px}header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
img.logo{width:50px;height:50px;border-radius:50%;flex:none}h1{font-size:18px;margin:0}h2{font-size:17px;margin:0}h3{margin:0 0 6px}.mu{color:var(--mu);font-size:13px}.sp{flex:1}
.nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--cd);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.nav button{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-size:11px;padding:4px 0;display:flex;flex-direction:column;align-items:center;cursor:pointer;border-radius:12px}.nav button b{font-size:19px;font-weight:400}.nav .on{color:var(--pr);font-weight:700}
@media(min-width:900px){.app{padding:20px 236px 30px 20px}.nav{top:0;bottom:0;left:auto;width:212px;flex-direction:column;justify-content:flex-start;gap:4px;border-top:0;border-left:1px solid var(--bd);padding:84px 10px 10px}.nav button{flex:none;flex-direction:row;gap:10px;font-size:14px;padding:11px 12px;justify-content:flex-start}.nav .on{background:var(--sf)}}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:14px;box-shadow:var(--sh)}.g{display:grid;gap:12px;margin-bottom:12px}.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.st b{display:block;font-size:25px}.st span{color:var(--mu);font-size:13px}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.row.j{justify-content:space-between}
.btn{border:0;border-radius:11px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer;background:var(--pr);color:var(--pt)}.b2{background:var(--sf);color:var(--tx);border:1px solid var(--bd)}.bd{background:var(--er);color:#fff}.sm{padding:5px 10px;font-size:13px}.big{width:100%;padding:18px;font-size:18px;border-radius:16px}.btn[disabled]{opacity:.5}
input,select{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:11px;background:var(--sf);color:var(--tx);font:inherit}label{display:block;font-size:13px;color:var(--mu);margin:9px 0 3px}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--sf);border:1px solid var(--bd)}.ok{color:var(--ok)}.wr{color:var(--wr)}.er{color:var(--er)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-size:12px}tfoot td{font-weight:700;border:0}.sc{overflow-x:auto}
.mb{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:14px;z-index:20}.mc{background:var(--cd);border-radius:18px;padding:18px;width:100%;max-width:470px;max-height:90vh;overflow:auto}
.bar{height:8px;border-radius:9px;background:var(--bd);overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--pr)}.em{text-align:center;padding:30px 10px;color:var(--mu)}.em b{display:block;font-size:34px}
.tt{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:12px;z-index:30;font-size:14px;max-width:90%}
.lg{max-width:380px;margin:8vh auto;text-align:center}.lg img{width:110px;height:110px;border-radius:50%}.lg label{text-align:right}

// ---- Firebase REST ----
let U=null;const AUTH='https://identitytoolkit.googleapis.com/v1/accounts:';
async function au(p,b){const r=await fetch(AUTH+p+'?key='+CFG.apiKey,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}),d=await r.json();if(!r.ok)throw Error(d.error?.message||'ERR');return d}
const sess=d=>{U={uid:d.localId||d.user_id,tok:d.idToken||d.id_token,rt:d.refreshToken||d.refresh_token,exp:Date.now()+(+d.expiresIn||+d.expires_in||3600)*1000};try{localStorage.setItem('tal_s',JSON.stringify({rt:U.rt}))}catch(e){}};
async function tk(){if(U.exp-Date.now()<60000){const r=await fetch('https://securetoken.googleapis.com/v1/token?key='+CFG.apiKey,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(U.rt)}),d=await r.json();if(!r.ok)throw Error('AUTH');sess(d)}return U.tok}
async function api(m,p,b){const r=await fetch(`${CFG.databaseURL}/${p}.json?auth=${await tk()}`,{method:m,headers:{'Content-Type':'application/json'},body:b===undefined?undefined:JSON.stringify(b)});if(!r.ok)throw Error(r.status===401||r.status===403?'لا تملك صلاحية لهذه العملية':'خطأ في الخادم '+r.status);return r.json()}

const E=id=>EM.find(e=>e.id===id),isOff=d=>new Date(d+'T00:00:00').getDay()===+CF.off,rec=(u,d)=>(AT[u]||{})[d];
const lvDates=l=>{const r=[];for(let d=new Date(l.f+'T00:00:00'),e=new Date(l.e+'T00:00:00');d<=e;d.setDate(d.getDate()+1)){const s=dstr(d);if(!isOff(s))r.push(s)}return r};
const onLv=(u,d)=>LV.some(l=>l.uid===u&&l.s==='ap'&&l.f<=d&&d<=l.e);
const LT={annual:'سنوية',sick:'مرضية',unpaid:'بدون راتب'},LS={pn:'قيد المراجعة',ap:'معتمدة',rj:'مرفوضة'};
const aIdx=(a,m)=>{const i=mdiff(a.st,m);return i>=0&&i<a.mo&&(!a.cl||m<a.cl)?i:-1};
const aRem=a=>{if(a.s!=='ap'||a.cl)return 0;const p=Math.min(a.mo,Math.max(0,mdiff(a.st,today().slice(0,7))));return Math.max(0,a.amt-p*a.amt/a.mo)};
const used=u=>LV.filter(l=>l.uid===u&&l.s==='ap'&&l.t==='annual'&&l.f.startsWith(today().slice(0,4))).reduce((s,l)=>s+lvDates(l).length,0);
function pay(e,m){const all=mDates(m).filter(d=>!isOff(d)),t=today(),ds=all.filter(d=>d<=t),lm={},rc=AT[e.id]||{};
LV.filter(l=>l.uid===e.id&&l.s==='ap').forEach(l=>lvDates(l).forEach(d=>lm[d]=l.t));
let pr=0,ab=0,pl=0,late=0,ot=0;ds.forEach(d=>{const r=rc[d];if(r&&r.iTs){pr++;if(tmin(r.iTs)>mins(CF.start)+5)late++;if(r.oTs)ot+=Math.max(0,(r.oTs-r.iTs)/36e5-CF.wh)}else if(lm[d]&&lm[d]!=='unpaid')pl++;else ab++});
const daily=e.sal/(all.length||1),otPay=ot*daily/CF.wh*CF.ot,abD=ab*daily;let adv=0;AD.forEach(a=>{if(a.uid===e.id&&a.s==='ap'&&aIdx(a,m)>=0)adv+=a.amt/a.mo});
const j=(AJ[e.id])||{},b=+j.b||0,d=+j.d||0;return{pr,ab,pl,late,ot,daily,otPay,abD,adv,b,d,j,net:e.sal-abD+otPay-adv+b-d}}
